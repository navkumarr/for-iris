<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my Iris</title>
<meta name="theme-color" content="#15100f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Karla:wght@400;500;600&family=Caveat:wght@500&display=swap">
<style>
:root{
  --paper:#f6efe6;--paper-deep:#ecdfcf;--rule:#d9c6b3;--ink:#2a1d1a;--ink-muted:#6b5650;
  --rose:#b4485a;--on-rose:#fff8f2;--blush:#e8b4b8;--wine:#5a1f2b;--gold:#c9a46a;
  --scrim:rgba(21,16,15,.55);--on-photo:#fbf5ee;
  --night:#15100f;--night-deep:#221917;--night-rose:#e07a8a;
  --iris-deep:#3d2368;--iris:#6a48b0;--iris-light:#b8a2ea;
  --space-1:8px;--space-2:16px;--space-3:32px;--space-4:64px;
  --radius-sm:2px;--radius-md:12px;--radius-pill:999px;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:Karla,system-ui,sans-serif;--hand:Caveat,"Segoe Script",cursive;
  --gutter:var(--space-4);
  --fade:1.2s;
}
@media (max-width:600px){:root{--gutter:var(--space-2)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--on-photo);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- Start screen ---------- */
#start{position:fixed;inset:0;z-index:30;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);text-align:center;padding:var(--gutter);transition:opacity 1.4s ease}
#start.gone{opacity:0;pointer-events:none}
.label{font:600 12px/16px var(--sans);letter-spacing:.14em;text-transform:uppercase}
#start .label{color:var(--ink-muted)}
#start h1{margin:0;font:italic 500 clamp(44px,9vw,72px)/.95 var(--serif)}
.rule{width:48px;height:1px;background:var(--rule)}
#play{width:72px;height:72px;border:0;border-radius:var(--radius-pill);background:var(--rose);display:grid;place-items:center;transition:transform .3s ease}
#play:hover{transform:scale(1.05)}
#play svg{fill:var(--on-rose);margin-left:4px}
#start .hand{font:500 24px/1.15 var(--hand);color:var(--ink-muted)}
#start .hint{font-size:13px;color:var(--ink-muted);opacity:.8}

/* ---------- Stage & scenes ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--night)}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity;visibility:hidden;transition:opacity var(--fade) ease-in-out,visibility 0s linear var(--fade)}
.scene.on{opacity:1;visibility:visible;transition:opacity var(--fade) ease-in-out,visibility 0s}

/* PhotoScene: full-bleed with slow pan & zoom */
.photo img,.photo video,.bloom .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* A photo whose shape doesn't match the screen (e.g. vertical photo on a laptop) is shown whole, over a blurred copy of itself */
.photo .blurbg{display:none;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px)}
.photo.fit .blurbg{display:block}
.photo.fit .main{object-fit:contain}
.photo img{transform-origin:var(--focal,50% 40%);will-change:transform;backface-visibility:hidden}
.scene.on.photo img.main{animation:kenburns var(--dur,6s) linear forwards}
@keyframes kenburns{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,0,0) scale(1.08)}}

/* Card: a screenshot shown whole over a blurred copy of itself */
.blurbg{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) brightness(.35) saturate(1.2);will-change:transform;transform:translateZ(0)}
.cards{position:absolute;left:var(--gutter);right:var(--gutter);top:max(5dvh,var(--space-2));bottom:26dvh;display:flex;align-items:center;justify-content:center;gap:var(--space-3)}
.cards figure{margin:0;flex:0 1 auto;min-width:0;display:flex;flex-direction:column;opacity:0;transform:translateY(16px) scale(.97) rotate(var(--tilt,0deg));transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);will-change:transform,opacity;backface-visibility:hidden}
.scene.on .cards figure{opacity:1;transform:rotate(var(--tilt,0deg))}
.cards img{display:block;max-width:100%;max-height:var(--mh,64dvh);width:auto;height:auto;object-fit:contain;border-radius:var(--radius-md);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.cards.n2{--mh:60dvh}.cards.n3{--mh:52dvh}
.cards.n2 figure,.cards.n3 figure{max-width:calc((100% - var(--space-3)*2)/var(--n))}
/* Prints (polaroid frames) */
.cards.prints figure{background:var(--paper-deep);padding:10px 10px 0;border-radius:var(--radius-sm);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cards.prints img{border-radius:var(--radius-sm);box-shadow:none;max-height:calc(var(--mh) - 80px)}
.cards.prints figcaption{color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;padding:6px 4px 10px;text-align:center}
.cards.prints figcaption .note{font:500 clamp(18px,2.2vw,24px)/1.1 var(--hand);color:var(--ink)}
.cards.prints figcaption .date{display:flex;align-items:center;gap:var(--space-1)}
.cards.prints figcaption .label{color:var(--ink-muted);font-size:14px}
.cards.prints figcaption b{width:6px;height:6px;border-radius:var(--radius-pill);background:var(--gold)}
@media (orientation:portrait){
  .cards{flex-direction:column;gap:0}
  .cards figure{max-width:100% !important}
  .cards.n2{--mh:33dvh}.cards.n3{--mh:24dvh}
  .cards.n2 figure+figure,.cards.n3 figure+figure{margin-top:-2dvh}
  .cards.n2 figure:nth-child(1){align-self:flex-start;margin-left:6%}
  .cards.n2 figure:nth-child(2){align-self:flex-end;margin-right:6%}
}

/* Line scene: just the words */
.line{background:var(--night)}

/* Sun breaking through clouds (Image 15) */
.sun{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sun .glow{position:absolute;right:-20vmax;top:-20vmax;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.95) 0%,rgba(255,214,150,.45) 22%,rgba(255,200,140,0) 60%);opacity:0;will-change:opacity}
.sun .rays{position:absolute;right:-60vmax;top:-60vmax;width:140vmax;height:140vmax;background:repeating-conic-gradient(from 0deg,rgba(255,240,205,.22) 0deg 4deg,rgba(255,240,205,0) 4deg 13deg);-webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 55%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 55%);opacity:0;will-change:opacity}
.sun .cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(250,250,252,.95),rgba(250,250,252,.8) 55%,rgba(250,250,252,0));will-change:transform,opacity}
.sun .c1{width:70vmax;height:34vmax;right:-14vmax;top:-10vmax}
.sun .c2{width:56vmax;height:30vmax;right:20vmax;top:-12vmax}
.sun .c3{width:60vmax;height:26vmax;right:-24vmax;top:14vmax}
.scene.on .sun .glow{animation:glow 3.2s ease-out .8s forwards}
.scene.on .sun .rays{animation:rays 3.5s ease-out 1.2s forwards}
.scene.on .sun .c1{animation:drift1 4.5s cubic-bezier(.4,0,.2,1) .3s forwards}
.scene.on .sun .c2{animation:drift2 4.5s cubic-bezier(.4,0,.2,1) .3s forwards}
.scene.on .sun .c3{animation:drift3 4.5s cubic-bezier(.4,0,.2,1) .3s forwards}
@keyframes glow{to{opacity:1}}
@keyframes rays{to{opacity:1}}
@keyframes drift1{to{transform:translate3d(30vmax,-20vmax,0);opacity:0}}
@keyframes drift2{to{transform:translate3d(-40vmax,-14vmax,0);opacity:0}}
@keyframes drift3{to{transform:translate3d(30vmax,24vmax,0);opacity:0}}

/* Iris bloom over Image 22 */
.bloom .bg{transform:translate3d(0,0,0) scale(1.06);transition:transform 18s linear;will-change:transform}
.scene.on.bloom .bg{transform:translate3d(0,0,0) scale(1)}
.bloom .dim{position:absolute;inset:0;background:#000;opacity:.6;transition:opacity 6s ease 3s;will-change:opacity}
.scene.on.bloom .dim{opacity:.28}
.flower{position:absolute;left:50%;top:38%;width:min(86vw,58dvh);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 40px rgba(30,10,60,.5))}
.flower svg{width:100%;height:100%;overflow:visible}
.flower .p{transform-box:view-box;transform-origin:0 0;opacity:0;transform:scale(.1) rotate(-25deg)}
.flower .leaf{transform-origin:2px 210px}
.flower .stem{stroke-dasharray:400;stroke-dashoffset:400}
.flower .heart{opacity:0}
.scene.on .flower .stem{animation:stem 1.6s ease-out .4s forwards}
.scene.on .flower .p{animation:petal 2.6s cubic-bezier(.2,.8,.2,1) forwards}
.scene.on .flower .heart{animation:fadein 1.5s ease 3.4s forwards}
.scene.on .flower{animation:sway 7s ease-in-out 4.5s infinite alternate}
@keyframes stem{to{stroke-dashoffset:0}}
@keyframes petal{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes fadein{to{opacity:1}}
@keyframes sway{from{transform:translate(-50%,-50%) rotate(-1.5deg)}to{transform:translate(-50%,-50%) rotate(1.5deg)}}

/* ---------- Captions: the letter, word by word ---------- */
#scrim{position:fixed;left:0;right:0;bottom:0;height:46dvh;background:linear-gradient(to top,rgba(21,16,15,.88),rgba(21,16,15,.55) 45%,rgba(21,16,15,0));pointer-events:none;transition:opacity var(--fade) ease;z-index:5}
#caption{position:fixed;left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:6;text-align:center;pointer-events:none;transition:bottom var(--fade) ease,transform var(--fade) ease}
#caption p{margin:0 auto;max-width:24em;font:italic 400 clamp(21px,2.6vw,32px)/1.3 var(--serif);color:var(--on-photo);text-shadow:0 1px 10px rgba(0,0,0,.4);transition:opacity .7s ease}
#caption p.out{opacity:0}
#caption span{opacity:0;display:inline-block;transform:translate3d(0,6px,0);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1);will-change:transform,opacity}
#caption span.in{opacity:1;transform:translate3d(0,0,0)}
#caption em{font-style:italic;color:var(--night-rose)}
body.centered #scrim{opacity:0}
body.centered #caption{bottom:50%;transform:translateY(50%)}
body.centered #caption p{font-size:clamp(28px,4.4vw,52px);max-width:16em;line-height:1.2}

/* ---------- Player bar ---------- */
#bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--space-2));transform:translateX(-50%);width:calc(100% - var(--space-2)*2);max-width:480px;z-index:10;display:flex;align-items:center;gap:var(--space-2);background:rgba(34,25,23,.92);border-radius:var(--radius-md);padding:var(--space-1) var(--space-2) var(--space-1) var(--space-1);transition:opacity .6s ease;opacity:0;pointer-events:none}
body.playing #bar{opacity:1;pointer-events:auto}
body.playing.idle #bar{opacity:0;pointer-events:none}
#pp{flex:none;width:40px;height:40px;border:0;border-radius:var(--radius-pill);background:var(--night-rose);display:grid;place-items:center}
#pp svg{fill:#2a1014}
#track{flex:1;height:24px;position:relative;cursor:pointer;touch-action:none}
#track::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:var(--radius-pill);background:#4a2a2e}
#fill{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:0;border-radius:var(--radius-pill);background:var(--night-rose)}
#knob{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px;border-radius:var(--radius-pill);background:var(--night-rose)}
#time{font:600 12px/16px var(--sans);letter-spacing:.08em;color:#b9a69c;font-variant-numeric:tabular-nums;min-width:76px;text-align:right}

/* ---------- End card & letter ---------- */
#end{position:fixed;inset:0;z-index:20;background:var(--wine);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);text-align:center;padding:var(--gutter);opacity:0;pointer-events:none;transition:opacity 2s ease}
#end.on{opacity:1;pointer-events:auto}
#end h2{margin:0;font:italic 500 clamp(44px,8vw,72px)/.95 var(--serif)}
#end .hand{font:500 26px/1.15 var(--hand);opacity:.9}
#end .actions{display:flex;gap:var(--space-2);align-items:center;opacity:0;transition:opacity 1.5s ease 2.5s}
#end.on .actions{opacity:1}
.btn{border:1px solid var(--on-photo);background:none;border-radius:var(--radius-pill);padding:12px 20px;color:var(--on-photo)}
.lnk{border:0;background:none;color:var(--on-photo);text-decoration:underline;text-underline-offset:4px;padding:12px 8px}
#letter{position:fixed;inset:0;z-index:25;background:var(--paper);color:var(--ink);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .8s ease}
#letter.on{opacity:1;pointer-events:auto}
#letter article{max-width:34em;margin:0 auto;padding:var(--space-4) var(--gutter) var(--space-4)}
#letter .label{color:var(--ink-muted)}
#letter h2{font:italic 500 40px/1 var(--serif);margin:var(--space-2) 0 var(--space-3)}
#letter p{font:400 22px/1.5 var(--serif);margin:0 0 1em}
#letter .close{color:var(--ink);border-color:var(--ink);margin-top:var(--space-3)}

@media (prefers-reduced-motion:reduce){
  .scene.on.photo img.main,.scene.on .flower{animation:none}
  .bloom .bg{transition:none}
}
</style>
</head>
<body>

<section id="start">
  <h1>For my Iris</h1>
  <div class="rule"></div>
  <button id="play" aria-label="Play the letter"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
</section>

<main id="stage" aria-live="off"></main>
<div id="scrim"></div>
<div id="caption" aria-live="polite"><p></p></div>

<div id="bar">
  <button id="pp" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 16 16"><g id="ico-pause"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></g><path id="ico-play" d="M4 2l10 6-10 6z" style="display:none"/></svg></button>
  <div id="track" role="slider" aria-label="Seek" tabindex="0"><div id="fill"></div><div id="knob"></div></div>
  <span id="time">0:00 / 1:44</span>
</div>

<section id="end" aria-hidden="true">
  <h2>I love you, Iris.</h2>
  <span class="hand">from nav</span>
  <div class="actions"><button class="btn label" id="again">Play again</button><button class="lnk label" id="read">Read the letter</button></div>
</section>

<section id="letter" aria-hidden="true"><article>
  <span class="label">The letter</span>
  <h2>For my Iris</h2>
  <div id="letter-text"></div>
  <button class="btn label close" id="close">Close</button>
</article></section>

<audio id="audio" src="media/letter.m4a" preload="auto" playsinline></audio>

<!-- Iris flower, reused by the bloom scene -->
<template id="iris-svg">
<svg viewBox="-150 -170 300 380" aria-hidden="true">
  <defs>
    <linearGradient id="gFall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c1650"/><stop offset=".45" stop-color="#5a3a9e"/><stop offset="1" stop-color="#8a6fd0"/></linearGradient>
    <linearGradient id="gStd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4b2c86"/><stop offset=".6" stop-color="#8d73d6"/><stop offset="1" stop-color="#c8b8f2"/></linearGradient>
    <linearGradient id="gBeard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#e2a63c" stop-opacity="0"/></linearGradient>
  </defs>
  <path class="stem" d="M0 30 C 4 90 -6 150 2 210" stroke="#4f7a43" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path class="p leaf" style="animation-delay:1.2s" d="M2 210 C 30 170 60 140 70 100 C 40 130 20 160 2 205Z" fill="#5d8a4e"/>
  <!-- standards (upright) -->
  <g class="p std" style="animation-delay:1.9s"><path d="M0 0 C -40 -40 -46 -110 -6 -150 C 2 -158 10 -150 14 -140 C 40 -100 34 -40 0 0Z" fill="url(#gStd)"/></g>
  <g class="p std" style="animation-delay:1.6s"><path transform="rotate(-38)" d="M0 0 C -30 -40 -36 -100 -2 -132 C 6 -138 12 -130 14 -122 C 34 -90 28 -36 0 0Z" fill="url(#gStd)" opacity=".92"/></g>
  <g class="p std" style="animation-delay:1.75s"><path transform="rotate(38)" d="M0 0 C -28 -36 -34 -90 -14 -122 C -8 -130 0 -136 4 -128 C 34 -98 30 -40 0 0Z" fill="url(#gStd)" opacity=".92"/></g>
  <!-- falls (drooping) -->
  <g class="p fall" style="animation-delay:2.2s"><path transform="rotate(-62)" d="M0 0 C -46 18 -62 80 -40 126 C -26 150 26 150 40 126 C 62 80 46 18 0 0Z" fill="url(#gFall)"/><path transform="rotate(-62)" d="M0 8 C -6 40 -4 70 0 92 C 4 70 6 40 0 8Z" fill="url(#gBeard)"/></g>
  <g class="p fall" style="animation-delay:2.35s"><path transform="rotate(62)" d="M0 0 C -46 18 -62 80 -40 126 C -26 150 26 150 40 126 C 62 80 46 18 0 0Z" fill="url(#gFall)"/><path transform="rotate(62)" d="M0 8 C -6 40 -4 70 0 92 C 4 70 6 40 0 8Z" fill="url(#gBeard)"/></g>
  <g class="p fall" style="animation-delay:2.5s"><path d="M0 4 C -40 20 -52 74 -34 112 C -22 132 22 132 34 112 C 52 74 40 20 0 4Z" fill="url(#gFall)"/><path d="M0 10 C -6 38 -4 62 0 82 C 4 62 6 38 0 10Z" fill="url(#gBeard)"/></g>
  <circle class="heart" r="9" fill="#f3d27a"/>
</svg>
</template>

<script>
// ---- Timeline: when each scene starts (seconds into the recording) ----
const SCENES = [
  {at: 0,     type: 'line'},
  {at: 3.1,   type: 'cards', imgs: ['img-0']},
  {at: 8.0,   type: 'cards', imgs: ['img-1', 'img-2', 'img-3'], tilts: [-2, 1.5, -1]},
  {at: 11.2,  type: 'photo', img: 'img-7',  focal: '50% 30%'},
  {at: 13.7,  type: 'photo', img: 'img-8',  focal: '50% 35%'},
  {at: 19.1,  type: 'cards', imgs: ['img-9']},
  {at: 24.1,  type: 'cards', imgs: ['img-10']},
  {at: 27.2,  type: 'cards', imgs: ['img-11a']},
  {at: 28.85, type: 'photo', img: 'img-11b', focal: '50% 50%'},
  {at: 31.2,  type: 'video', src: 'video-1'},
  {at: 35.1,  type: 'line', em: ['easiest']},
  {at: 39.5,  type: 'cards', imgs: ['img-12']},
  {at: 41.75, type: 'cards', imgs: ['img-13']},
  {at: 43.7,  type: 'photo', img: 'img-14', focal: '50% 45%'},
  {at: 49.1,  type: 'photo', img: 'img-15', focal: '60% 50%', sun: true},
  {at: 54.3,  type: 'video', src: 'video-2'},
  {at: 58.8,  type: 'prints', imgs: ['img-16', 'img-17'], tilts: [-3, 2.5]},
  {at: 60.6,  type: 'photo', img: 'img-18', focal: '50% 35%'},
  {at: 64.2,  type: 'photo', img: 'img-19', focal: '50% 50%'},
  {at: 66.9,  type: 'photo', img: 'img-20', focal: '50% 35%'},
  {at: 70.9,  type: 'line'},
  {at: 73.5,  type: 'photo', img: 'img-21', focal: '50% 30%'},
  {at: 77.2,  type: 'bloom', img: 'img-22'},
  {at: 96.3,  type: 'prints', imgs: ['img-22', 'img-23'], dates: ['August 29', 'September 3'], notes: ['first photo together', 'first time saying i love you'], tilts: [-2.5, 2]},
  {at: 102.3, type: 'line', em: ['love']},
